        .no-scrollbar::-webkit-scrollbar { display: none; }
        .admin-only-content { display: none; }

</head>
<body class="bg-amber-50/40 min-h-screen text-slate-800 font-sans antialiased">
    
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none max-w-sm w-full px-4 flex flex-col gap-2"></div>

    <!-- Screen Login (Tetap Sama) -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-amber-100 via-yellow-50 to-amber-200">
        <div class="bg-white/95 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/60">
            <h1 class="text-2xl font-black text-center mb-6">WARUNG NYEMEEL</h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full p-3 bg-slate-50 border rounded-xl" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-slate-50 border rounded-xl" required>
                <button type="submit" class="w-full bg-brand text-slate-900 font-black py-3 rounded-xl">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Main UI -->
    <div id="appScreen" class="hidden">
        <!-- Tabs -->
        <div class="flex gap-2 p-4 overflow-x-auto bg-white border-b">
            <button onclick="switchTab('kasir')" class="px-4 py-2 bg-brand font-bold text-xs rounded-lg">Kasir</button>
            <button onclick="switchTab('pengeluaran')" class="px-4 py-2 bg-slate-100 font-bold text-xs rounded-lg">Pengeluaran</button>
            <button onclick="switchTab('hutang')" class="px-4 py-2 bg-slate-100 font-bold text-xs rounded-lg">Hutang</button>
            <button onclick="switchTab('laporan')" class="px-4 py-2 bg-slate-100 font-bold text-xs rounded-lg">Laporan</button>
        </div>

        <main class="p-4 max-w-7xl mx-auto">
            <!-- Filter Tanggal (Diterapkan di semua Tab) -->
            <div class="bg-white p-4 rounded-xl shadow-sm mb-4 flex gap-2 flex-wrap">
                <input type="date" id="filterDate" onchange="applyFilters()" class="p-2 border rounded-lg text-xs">
                <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold"><i class="fas fa-file-excel mr-1"></i> Export Excel</button>
            </div>

            <!-- Tab Content... (Semua Tab dengan fungsi filterDate) -->
            <div id="content-kasir">...</div>
            <div id="content-pengeluaran" class="hidden">...</div>
            <div id="content-hutang" class="hidden">...</div>
            <div id="content-laporan" class="hidden">...</div>
        </main>
    </div>

    <script>
        // FUNGSI EXPORT EXCEL
        function exportToExcel(type) {
            let data = type === 'exp' ? expenses : (type === 'debt' ? debts : sales);
            let csv = "data:text/csv;charset=utf-8,Tanggal,Keterangan,Nominal\n";
            data.forEach(item => {
                csv += `${item.date},${item.desc || item.customer},${item.amount || item.total}\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI(csv);
            link.download = `Data_${type}_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        // FUNGSI FILTER TANGGAL
        function applyFilters() {
            const date = document.getElementById('filterDate').value;
            // Logika filter: filter data array berdasarkan date string
            // ... panggil render ulang table
        }

        // FUNGSI LOAD GAMBAR QRIS (BASE64)
        // Masukkan string base64 QRIS asli Anda di sini
        document.getElementById('qrisImg').src = "data:image/jpeg;base64,iVBORw0KGgoAAAANSUhEUgAA..."; 
    </script>
</body>
</html>
