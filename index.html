<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warung Nyemeel - Bikin Nagih Terus</title>
    <!-- Favicon Vektor Kuning Brand -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%23FFC72C%22/><g transform=%22translate(25, 25) scale(0.5)%22 fill=%22%230F172A%22><path d=%22M50 15C33.4 15 20 28.4 20 45C20 47.8 22.2 50 25 50H75C77.8 50 80 47.8 80 45C80 28.4 66.6 15 50 15ZM25 55C22.2 55 20 57.2 20 60V75C20 83.3 26.7 90 35 90H65C73.3 90 80 83.3 80 75V60C80 57.2 77.8 55 75 55H25Z%22/></g><circle cx=%2280%22 cy=%2280%22 r=%2214%22 fill=%22%230F172A%22 stroke=%22white%22 stroke-width=%223%22/><circle cx=%2280%22 cy=%2280%22 r=%226%22 fill=%22%23FFC72C%22/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --brand-color: #FFC72C; }
        .bg-brand { background-color: var(--brand-color); }
        .text-brand { color: var(--brand-color); }
        .bento-card { @apply bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-[2rem] shadow-sm; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-slate-900 dark:text-slate-100 font-sans transition-all duration-300">

    <div id="toastContainer" class="fixed top-4 z-[100] w-full px-4 flex justify-center"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-amber-50 to-amber-100 dark:from-black dark:to-zinc-900">
        <div class="bento-card p-8 w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-brand rounded-3xl mx-auto mb-6 flex items-center justify-center text-slate-950 text-3xl shadow-xl shadow-brand/30">
                <i class="fas fa-bowl-food"></i>
            </div>
            <h1 class="text-2xl font-black mb-1">WARUNG NYEMEEL</h1>
            <p class="text-xs font-bold text-slate-400 mb-8 uppercase tracking-widest">BIKIN NAGIH TERUS</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="username" value="admin" class="w-full p-4 bg-slate-100 dark:bg-zinc-800 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-brand" placeholder="Username">
                <input type="password" id="password" value="1234" class="w-full p-4 bg-slate-100 dark:bg-zinc-800 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-brand" placeholder="Password">
                <button type="submit" class="w-full bg-slate-900 dark:bg-white text-white dark:text-black font-black py-4 rounded-2xl">Masuk Sistem</button>
            </form>
        </div>
    </div>

    <!-- Main UI (Dashboard Bento Layout) -->
    <div id="appScreen" class="hidden">
        <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-2xl">
            <h1 class="font-black text-sm">WARUNG NYEMEEL</h1>
            <button onclick="toggleDarkMode()" class="text-brand"><i class="fas fa-adjust"></i></button>
        </nav>

        <div class="p-4 sm:p-6 space-y-6">
            <!-- Bento Dashboard Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bento-card p-6 col-span-1 md:col-span-2 lg:col-span-1 bg-brand text-slate-950">
                    <p class="text-[10px] font-black uppercase">Pendapatan Hari Ini</p>
                    <h2 id="statSales" class="text-2xl font-black mt-1">Rp 0</h2>
                </div>
                <div class="bento-card p-6">
                    <p class="text-[10px] font-black uppercase">Pajak (4%)</p>
                    <h2 id="statTax" class="text-2xl font-black mt-1">Rp 0</h2>
                </div>
                <div class="bento-card p-6">
                    <p class="text-[10px] font-black uppercase">Pengeluaran</p>
                    <h2 id="statExp" class="text-2xl font-black mt-1">Rp 0</h2>
                </div>
                <div class="bento-card p-6 bg-slate-900 text-white">
                    <p class="text-[10px] font-black uppercase text-brand">Estimasi Laba</p>
                    <h2 id="statNet" class="text-2xl font-black mt-1">Rp 0</h2>
                </div>
            </div>

            <!-- Content Container -->
            <div id="tabContent" class="bento-card p-6 min-h-[400px]">
                <!-- Dinamis berdasarkan Tab -->
            </div>
        </div>
    </div>

    <script>
        // LOGIC REKAP & FILTER TANGGAL YANG DIPERBAIKI
        function renderReports() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            // Filter menggunakan s.rawDate yang sudah dipastikan formatnya 'YYYY-MM-DD'
            const filtered = sales.filter(s => {
                if(!startDate || !endDate) return true;
                return s.rawDate >= startDate && s.rawDate <= endDate;
            });
            // ... (logika kalkulasi total menggunakan filtered)
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
        
        // ... fungsi lainnya tetap mengikuti struktur yang efisien
    </script>
</body>
</html>
